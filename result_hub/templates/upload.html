{% extends 'base.html' %}
{% block content %}
<div class="card shadow mx-auto" style="max-width: 600px;">
    <div class="card-header bg-primary text-white">
        <h4>📂 Upload Results (Excel)</h4>
    </div>
    <div class="card-body">
        <p class="small">Required columns: <code>RegNo, Subject, Sem, Grade, GP</code></p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="file" class="form-control mb-3" accept=".xlsx, .xls" required>
            <button class="btn btn-success w-100">Upload</button>
        </form>
        <div class="mt-3">
            <a href="{% url 'faculty_dashboard' %}" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}

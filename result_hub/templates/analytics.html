{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">Failed Subjects Distribution</div>
            <div class="card-body">
                <canvas id="failChart" height="250"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-info text-white">Overall Stats</div>
            <div class="card-body">
                <h4>Pass Percentage: {{ pass_percent }}%</h4>
                <h5>Total Results: {{ total_results }}</h5>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('failChart').getContext('2d');
    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: [{% for f in failed %}"{{ f.subject__name }}",{% endfor %}],
            datasets: [{
                data: [{% for f in failed %}{{ f.count }},{% endfor %}],
                backgroundColor: ['#dc3545', '#fd7e14', '#ffc107', '#20c997']
            }]
        }
    });
</script>
{% endblock %}
